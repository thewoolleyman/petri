[package]
name = "petri-steps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Step kinds. The process step, written once against ExecEnv."
publish = false

[lints]
workspace = true

[lib]
# The package is `petri-steps`; the crate is `steps`, so code reads `steps::…`.
name = "steps"

[dependencies]
ir = { workspace = true }
executor = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# A paused clock drives the drain tests, so their verdict never depends on load.
tokio = { workspace = true, features = ["test-util"] }
